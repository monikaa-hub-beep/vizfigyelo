name: Update rainfall data
on:
  schedule:
    - cron: "20 */3 * * *"   # every 3 hours (HungaroMet updates its daily files once a day)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python collector/collect.py
      - name: Commit if changed
        run: |
          git config user.name "vizfigyelo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update rainfall data" && git push)
