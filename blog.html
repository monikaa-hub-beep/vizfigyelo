<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog – Vízfigyelő</title><link rel="stylesheet" href="assets/site.css"></head>
<body><main class="w prose" id="app"><p class="sub">Betöltés…</p></main>
<script>
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function md(src){ // minimal Markdown: #, ##, ###, **bold**, *italic*, [link](https://…), - lists
 const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|[a-z0-9\-]+\.html)\)/g,'<a href="$2" rel="noopener">$1</a>');
 let out="",ul=false,p=[];const fp=()=>{if(p.length){out+="<p>"+inl(p.join(" "))+"</p>";p=[]}},fu=()=>{if(ul){out+="</ul>";ul=false}};
 for(const raw of esc(src).split(/\r?\n/)){const l=raw.trim();let m;
  if(!l){fp();fu()}
  else if(m=l.match(/^(#{1,3})\s+(.*)/)){fp();fu();out+=`<h${m[1].length+1}>${inl(m[2])}</h${m[1].length+1}>`}
  else if(m=l.match(/^[-*]\s+(.*)/)){fp();if(!ul){out+="<ul>";ul=true}out+="<li>"+inl(m[1])+"</li>"}
  else{fu();p.push(l)}}
 fp();fu();return out}
const fd=d=>new Date(d).toLocaleDateString("hu-HU",{year:"numeric",month:"long",day:"numeric"});
async function route(){
 let posts=[];
 try{posts=await (await fetch("blog/index.json",{cache:"no-store"})).json()}catch(e){app.innerHTML="<p>A blog most nem érhető el.</p>";return}
 posts.sort((a,b)=>b.date.localeCompare(a.date));
 const slug=location.hash.slice(1),post=posts.find(p=>p.slug===slug);
 if(post){
  document.title=post.title+" – Vízfigyelő";
  try{const r=await fetch("blog/"+post.slug+".md",{cache:"no-store"});const t=r.ok?await r.text():"";
   if(!t||/^\s*<(!doctype|html)/i.test(t))throw 0;
   app.innerHTML=`<p><a href="blog.html">← Minden bejegyzés</a></p><h1>${esc(post.title)}</h1><p class="note">${fd(post.date)}</p>`+md(t)}
  catch(e){app.innerHTML=`<p><a href="blog.html">← Minden bejegyzés</a></p><p>A bejegyzés most nem tölthető be.</p>`}
 }else{
  document.title="Blog – Vízfigyelő";
  app.innerHTML="<h1>Blog</h1>"+(posts.length?posts.map(p=>`<a class="post card" href="#${esc(p.slug)}"><h2>${esc(p.title)}</h2><div class="note">${fd(p.date)}</div><p style="margin:.4em 0 0">${esc(p.summary||"")}</p></a>`).join(""):"<p>Még nincs bejegyzés.</p>");
 }
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
</script><script src="assets/site.js"></script></body></html>
